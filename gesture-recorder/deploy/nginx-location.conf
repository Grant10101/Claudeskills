# If the site is served by nginx on the server (behind Cloudflare), add inside its server { } block:
location /gestures/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}
location = /gestures { return 301 /gestures/; }
